services:
  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onecost}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-onecost}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 384M
        reservations:
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    environment:
      APP_DIR: /app
      COMPROVANTES_STATIC_DIR: /app/static/comprovantes
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-onecost}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AD_SERVER_IP: ${AD_SERVER_IP}
      AD_DOMAIN: ${AD_DOMAIN}
      AD_BASE_DN: ${AD_BASE_DN:-DC=mdr,DC=local}
      AD_SERVICE_USER: ${AD_SERVICE_USER}
      AD_SERVICE_PASS: ${AD_SERVICE_PASS}
      ONELOG_USERNAME: ${ONELOG_USERNAME}
      ONELOG_PASSWORD: ${ONELOG_PASSWORD}
      ROBOT_USERNAME: ${ROBOT_USERNAME:-robot}
      ROBOT_PASSWORD: ${ROBOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - comprovantes_data:/app/static/comprovantes
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 512M
        reservations:
          memory: 256M

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 96M

  robot:
    build:
      context: ./robot
      dockerfile: Dockerfile.coolify
    restart: unless-stopped
    shm_size: 1gb
    environment:
      APP_DIR: /app
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
      ROBOT_USERNAME: ${ROBOT_USERNAME:-robot}
      ROBOT_PASSWORD: ${ROBOT_PASSWORD}
      ONELOG_API_URL: ${ONELOG_API_URL}
      ONELOG_USERNAME: ${ONELOG_USERNAME}
      ONELOG_PASSWORD: ${ONELOG_PASSWORD}
      LOKI_URL: ${LOKI_URL}
      ROBOT_CYCLE_DELAY_SECONDS: ${ROBOT_CYCLE_DELAY_SECONDS:-60}
      ROBOT_QUEUE_STATUSES: ${ROBOT_QUEUE_STATUSES:-Pendente,Monitorando retorno do banco}
      ROBOT_MAX_ITEMS_PER_CYCLE: ${ROBOT_MAX_ITEMS_PER_CYCLE:-20}
      ROBOT_RECENT_PENDING_DAYS: ${ROBOT_RECENT_PENDING_DAYS:-10}
      ROBOT_MONITORING_LOOKBACK_DAYS: ${ROBOT_MONITORING_LOOKBACK_DAYS:-10}
      ROBOT_MONITORING_RECHECK_MINUTES: ${ROBOT_MONITORING_RECHECK_MINUTES:-30}
      ROBOT_RESET_ERRORS_ON_START: ${ROBOT_RESET_ERRORS_ON_START:-false}
      BB_BROWSER_PROXY_SERVER: ${BB_BROWSER_PROXY_SERVER:-}
      BB_BROWSER_PROXY_USERNAME: ${BB_BROWSER_PROXY_USERNAME:-}
      BB_BROWSER_PROXY_PASSWORD: ${BB_BROWSER_PROXY_PASSWORD:-}
    depends_on:
      - backend
    volumes:
      - comprovantes_data:/app/comprovantes
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: 1280M
        reservations:
          memory: 384M

volumes:
  postgres_data:
  comprovantes_data:
